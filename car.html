<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sports Car Showcase</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #ui h1 {
            margin: 0 0 10px;
            font-size: 1.8em;
            color: #ff3366;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            display: flex;
            gap: 15px;
            backdrop-filter: blur(5px);
        }
        .key {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            transition: opacity 1s;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ff3366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <div>Loading 3D Environment...</div>
    </div>

    <div id="ui">
        <h1>Sports Car Showcase</h1>
        <p>Experience this high-performance sports car in a beautiful environment.</p>
        <p id="car-position">Position: 0, 0</p>
    </div>

    <div id="controls">
        <div class="key">↑</div>
        <div class="key">↓</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Main Application
        document.addEventListener('DOMContentLoaded', () => {
            // Check for WebGL support
            if (!window.WebGLRenderingContext || !document.createElement('canvas').getContext('webgl')) {
                document.getElementById('loading').innerHTML = `
                    <h2>WebGL Not Supported</h2>
                    <p>Please use Chrome, Firefox, or Edge to view this experience.</p>
                `;
                throw new Error('WebGL not supported');
            }

            // Scene Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

            // Camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3a5f0b,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Road
            const roadGeometry = new THREE.PlaneGeometry(15, 200);
            const roadMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.1
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.01;
            road.receiveShadow = true;
            scene.add(road);

            // Create realistic sports car
            function createSportsCar() {
                const car = new THREE.Group();
                
                // Main body
                const bodyGeometry = new THREE.BoxGeometry(3.5, 1.2, 1.8);
                bodyGeometry.translate(0, 0.6, 0);
                const bodyMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0xff3366,
                    roughness: 0.2,
                    metalness: 0.8,
                    clearcoat: 1,
                    clearcoatRoughness: 0.1
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;
                car.add(body);

                // Cabin
                const cabinGeometry = new THREE.BoxGeometry(3.2, 0.8, 1.4);
                cabinGeometry.translate(0, 1.3, -0.1);
                const cabinMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x111111,
                    roughness: 0.1,
                    metalness: 0.9,
                    transparent: true,
                    opacity: 0.7
                });
                const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
                cabin.castShadow = true;
                car.add(cabin);

                // Windshield
                const windshieldGeometry = new THREE.BoxGeometry(2.8, 0.5, 1.2);
                windshieldGeometry.translate(0, 1.5, 0.3);
                const windshieldMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x88ccff,
                    roughness: 0.05,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.7,
                    ior: 1.5,
                    transmission: 0.9
                });
                const windshield = new THREE.Mesh(windshieldGeometry, windshieldMaterial);
                windshield.castShadow = true;
                car.add(windshield);

                // Wheels
                const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 32);
                wheelGeometry.rotateZ(Math.PI / 2);
                const wheelMaterial = new THREE.MeshStandardMaterial({
                    color: 0x222222,
                    roughness: 0.7,
                    metalness: 0.3
                });
                
                const wheelPositions = [
                    { x: -1.2, y: 0.4, z: 1 },
                    { x: 1.2, y: 0.4, z: 1 },
                    { x: -1.2, y: 0.4, z: -1 },
                    { x: 1.2, y: 0.4, z: -1 }
                ];
                
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.position.set(pos.x, pos.y, pos.z);
                    wheel.castShadow = true;
                    car.add(wheel);
                });

                // Spoiler
                const spoilerGeometry = new THREE.BoxGeometry(0.3, 0.2, 1.2);
                spoilerGeometry.translate(0, 1.4, -1.5);
                const spoilerMaterial = new THREE.MeshStandardMaterial({
                    color: 0x111111,
                    roughness: 0.2,
                    metalness: 0.9
                });
                const spoiler = new THREE.Mesh(spoilerGeometry, spoilerMaterial);
                spoiler.castShadow = true;
                car.add(spoiler);

                // Headlights
                const headlightGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                
                const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
                leftHeadlight.position.set(-1.2, 0.8, 1.5);
                car.add(leftHeadlight);
                
                const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
                rightHeadlight.position.set(1.2, 0.8, 1.5);
                car.add(rightHeadlight);

                // Taillights
                const taillightGeometry = new THREE.BoxGeometry(0.2, 0.3, 0.2);
                const taillightMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                
                const leftTaillight = new THREE.Mesh(taillightGeometry, taillightMaterial);
                leftTaillight.position.set(-1, 0.8, -1.5);
                car.add(leftTaillight);
                
                const rightTaillight = new THREE.Mesh(taillightGeometry, taillightMaterial);
                rightTaillight.position.set(1, 0.8, -1.5);
                car.add(rightTaillight);

                return car;
            }

            const car = createSportsCar();
            scene.add(car);

            // Create realistic trees
            function createTree(x, z, size = 1) {
                const tree = new THREE.Group();
                
                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.3 * size, 0.4 * size, 2 * size, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x8B4513,
                    roughness: 0.9,
                    metalness: 0
                });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 1 * size;
                trunk.castShadow = true;
                tree.add(trunk);
                
                // Leaves
                const leavesGeometry = new THREE.SphereGeometry(1.5 * size, 16, 16);
                const leavesMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x228B22,
                    roughness: 0.8,
                    metalness: 0
                });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.y = 3 * size;
                leaves.castShadow = true;
                tree.add(leaves);
                
                tree.position.set(x, 0, z);
                return tree;
            }

            // Add trees around the scene
            const trees = [];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 70;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                const size = 0.8 + Math.random() * 0.4;
                trees.push(createTree(x, z, size));
            }
            trees.forEach(tree => scene.add(tree));

            // Add some mountains in the distance
            function createMountain(x, z, size) {
                const mountain = new THREE.Group();
                
                // Base
                const baseGeometry = new THREE.ConeGeometry(10 * size, 8 * size, 8);
                const baseMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x5a3921,
                    roughness: 0.9,
                    metalness: 0
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 4 * size;
                base.rotation.y = Math.random() * Math.PI;
                mountain.add(base);
                
                // Snow cap
                const snowGeometry = new THREE.ConeGeometry(6 * size, 4 * size, 8);
                const snowMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff,
                    roughness: 0.2,
                    metalness: 0.1
                });
                const snow = new THREE.Mesh(snowGeometry, snowMaterial);
                snow.position.y = 8 * size;
                mountain.add(snow);
                
                mountain.position.set(x, -5, z);
                return mountain;
            }

            // Add mountains
            const mountains = [
                createMountain(-60, -60, 1.5),
                createMountain(60, -60, 1.2),
                createMountain(-60, 60, 1.3),
                createMountain(60, 60, 1.4)
            ];
            mountains.forEach(mountain => scene.add(mountain));

            // Add a sun
            const sunGeometry = new THREE.SphereGeometry(2, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                fog: false
            });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(50, 50, -50);
            scene.add(sun);

            // Controls
            let moveForward = false;
            let moveBackward = false;
            
            document.addEventListener('keydown', (event) => {
                switch (event.key) {
                    case 'ArrowUp': moveForward = true; break;
                    case 'ArrowDown': moveBackward = true; break;
                }
            });

            document.addEventListener('keyup', (event) => {
                switch (event.key) {
                    case 'ArrowUp': moveForward = false; break;
                    case 'ArrowDown': moveBackward = false; break;
                }
            });

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);

                // Car movement
                const speed = 0.4;
                
                if (moveForward) {
                    car.position.z -= speed * Math.cos(car.rotation.y);
                    car.position.x -= speed * Math.sin(car.rotation.y);
                }
                if (moveBackward) {
                    car.position.z += speed * Math.cos(car.rotation.y);
                    car.position.x += speed * Math.sin(car.rotation.y);
                }

                // Update camera to follow car
                camera.position.x = car.position.x - 8 * Math.sin(car.rotation.y);
                camera.position.z = car.position.z - 8 * Math.cos(car.rotation.y);
                camera.position.y = car.position.y + 3;
                camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

                // Update UI
                document.getElementById('car-position').textContent = 
                    `Position: ${car.position.x.toFixed(1)}, ${car.position.z.toFixed(1)}`;

                renderer.render(scene, camera);
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Hide loading screen and start animation
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    animate();
                }, 1000);
            }, 1500);
        });
    </script>
</body>
</html>
